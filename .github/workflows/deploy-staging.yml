name: Deploy staging

# Builds ONE immutable image, pushes it to DOCR, reconciles the staging App Spec (whose PRE_DEPLOY
# `migrate` job runs migrations + queue provisioning inside the VPC), waits for health, smokes it and
# runs the Playwright e2e against the deployed origin. docs/runbooks/staging-deploy.md has the
# one-time owner setup; docs/standards/environments-setup.md §6 is the contract.
#
# TRIGGER POLICY: manual only (no push/tag trigger). Staging is EPHEMERAL (48-96h TTL, §9); an
# automatic deploy would keep a production-shaped environment and its bill alive by accident.
# `environment: staging` carries required reviewers, so every run needs one owner approval.
# ONE job on purpose: GitHub asks for approval per job that names a protected environment, and the
# digest/evidence flow between steps without artifact hand-offs.
#
# MIGRATION PATH (the one canonical choice): the App Spec's PRE_DEPLOY `migrate` job, not a CI-runner
# step. The managed DB only trusts the app's private VPC identity (§2); GitHub-hosted runners have no
# stable address, so a runner-side migration would force a public DB path or a standing IP allowlist.
# DATABASE_URL_MIGRATION therefore lives as a secret on that one DO job component only - never in
# GitHub, never on a runtime component.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref (branch, tag or full SHA) to build and deploy
        required: false
        default: main
        type: string

permissions:
  contents: read
  checks: read

# Two deploys must never race on the same app; queue instead of cancelling one in flight.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: plexco

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: staging
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 (same pin as ci.yml)
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Resolve commit
        run: echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Require green CI on this exact commit
        # Required flow (§6): PR gates run BEFORE the image is built. Only a commit whose `verify`
        # job already passed can reach staging.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name == "verify")] | sort_by(.completed_at) | last | .conclusion')"
          echo "verify conclusion for ${SHA}: ${conclusion}"
          [ "${conclusion}" = "success" ] || { echo "::error::no successful 'verify' run on ${SHA}"; exit 1; }

      - uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DOCR (short-lived)
        run: doctl registry login --expiry-seconds 3600

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: 1. Build and push the image once (tag = git SHA; the DIGEST is what gets deployed)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/Dockerfile
          push: true
          tags: registry.digitalocean.com/${{ secrets.DOCR_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}:${{ env.SHA }}

      - name: Record deployment evidence
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          REF: ${{ inputs.ref }}
        run: |
          echo "DIGEST=${DIGEST}" >> "$GITHUB_ENV"
          jq -n --arg env staging --arg sha "$SHA" --arg digest "$DIGEST" --arg ref "$REF" \
            --arg repo "$IMAGE_REPOSITORY" \
            --arg run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg actor "$GITHUB_ACTOR" --arg at "$(date -u +%FT%TZ)" \
            '{environment:$env, git_sha:$sha, requested_ref:$ref, image_repository:$repo, image_tag:$sha, image_digest:$digest, built_at:$at, run_url:$run, triggered_by:$actor}' \
            > deployment-evidence.json
          cat deployment-evidence.json

      - name: 2. Render the spec (committed spec + live secrets + this digest)
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
          VPC_ID: ${{ vars.DO_VPC_ID }}
          APP_ID: ${{ vars.DO_APP_ID }}
        run: |
          doctl apps spec get "$APP_ID" --format json > live-spec.json
          yq -o=json infra/app.staging.yaml | infra/render-app-spec.sh live-spec.json > rendered-spec.json
          # Never print the rendered spec: it holds encrypted EV[...] secret values.
          jq '{name, region, components: [(.services, .workers, .jobs)[] | {name, digest: .image.digest}]}' rendered-spec.json

      - name: 3. Reconcile the app (creates the deployment; the PRE_DEPLOY migrate job runs first)
        env:
          APP_ID: ${{ vars.DO_APP_ID }}
        run: doctl apps update "$APP_ID" --spec rendered-spec.json

      - name: 4. Wait for the deployment carrying this digest to be ACTIVE
        env:
          APP_ID: ${{ vars.DO_APP_ID }}
        run: infra/wait-for-deployment.sh "$APP_ID" "$DIGEST" 1500

      - name: 5. Smoke (/healthz, landing, manifest)
        env:
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
        run: infra/smoke-check.sh "$STAGING_BASE_URL"

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9 (same pin as ci.yml)

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (same pin as ci.yml)
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @plexco/web exec playwright install --with-deps chromium

      - name: 6. Playwright e2e against the deployed origin (no local server)
        env:
          CI: "true"
          E2E_EXTERNAL: "1"
          PLAYWRIGHT_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
        run: pnpm --filter @plexco/web exec playwright test

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0 (same pin as ci.yml)
        if: always()
        with:
          name: deployment-evidence-staging
          path: deployment-evidence.json
          if-no-files-found: ignore
          retention-days: 90

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0 (same pin as ci.yml)
        if: failure()
        with:
          name: playwright-report-staging
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7
