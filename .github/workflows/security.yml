name: Security

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "37 15 * * 3"
  workflow_dispatch:

permissions:
  contents: read

# Actions-minutes hygiene (2026-08-07) — xem ghi chú ở ci.yml. Job osv-* gọi reusable
# workflow nên không đặt được timeout-minutes tại đây; cap áp cho semgrep.
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep CE
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.actor != 'dependabot[bot]'
    container:
      image: semgrep/semgrep@sha256:2b33f46ba66cf8cc2ad59ccfa7d22951fd00c632c38f1339e84ec8e6e641a942
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 (SHA verified vs tag 2026-07-17; Node 24 runtime)
      - name: Scan application and infrastructure code
        run: semgrep scan --config auto --error

  osv-pr:
    name: OSV dependency diff
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    # Reusable workflow declares these job permissions; caller must grant them
    # or the run dies at startup ("startup_failure", no logs). SARIF upload stays
    # disabled (no GHAS on this private repo).
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
    with:
      upload-sarif: false

  osv-full:
    name: OSV full dependency scan
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
    with:
      upload-sarif: false
