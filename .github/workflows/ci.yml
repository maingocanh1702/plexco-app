name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: plexco
          POSTGRES_PASSWORD: plexco_test
          POSTGRES_DB: plexco_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plexco -d plexco_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://plexco:plexco_test@localhost:5432/plexco_test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1 (SHA verified vs tag 2026-07-16)

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0 (SHA verified vs tag 2026-07-16)
        # version is taken from the "packageManager" field in package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 (SHA verified vs tag 2026-07-16)
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        # NOT `pnpm -w install`: with -w pnpm links only the ROOT project's deps,
        # leaving every workspace package without node_modules.
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -w typecheck

      - name: Format
        run: pnpm -w format:check

      - name: Lint
        run: pnpm -w lint

      - name: Build
        run: pnpm -w build

      - name: Test
        run: pnpm -w test
