name: CI

on:
  # PR branches run through the pull_request event only, which avoids a duplicate run per
  # push (owner decision 2026-10-18); pushes to main still run.
  push:
    branches: [main]
  pull_request:

# Least-privilege token (audit 2026-09-06 X-6): this workflow only reads the checkout and
# talks to the postgres service; nothing here writes to the repo, issues, or packages.
# security.yml / linear-sync.yml already declare theirs.
permissions:
  contents: read

# Actions-minutes hygiene (2026-08-07): quota tháng này từng cạn vì linear-sync cron */10.
# Run bị đẩy lùi bởi push mới trên cùng ref thì hủy — trạng thái đáng tin là của HEAD.
# Known, accepted trade-off: cancel-in-progress applies to main too, so two quick pushes to
# main leave only the latest run — a superseded main SHA has no CI record (X-6, not fixed here).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # pinned: ubuntu-latest moves to 26.04 from 2026-10-19 (actions/runner-images#14748)
    runs-on: ubuntu-24.04
    # Suite xanh chạy dưới ~10 phút; cap để run treo không ăn 6h quota mặc định.
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: plexco
          POSTGRES_PASSWORD: plexco_test
          POSTGRES_DB: plexco_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plexco -d plexco_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://plexco:plexco_test@localhost:5432/plexco_test
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 (SHA verified vs tag 2026-07-17; Node 24 runtime)
        with:
          # Full history REQUIRED: the "Review-readiness policy" step below runs
          # `git merge-base --is-ancestor <AUTHORITY_SHA> <main>` for every pinned
          # verdict, and a shallow checkout has neither those commits nor main's
          # history. Necessary but NOT sufficient: on pull_request runs
          # there is no local branch named main, only refs/remotes/origin/main —
          # scripts/check-review-readiness.mjs resolveMainRef() handles that
          # (audit 2026-09-06 X-1: 50/50 pins failed AUTHORITY_NOT_MAIN off-main).
          fetch-depth: 0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9 (peeled SHA verified vs tag 2026-07-17; Node 24 runtime)
        # version is taken from the "packageManager" field in package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (SHA verified vs tag 2026-07-17; Node 24 runtime)
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        # NOT `pnpm -w install`: with -w pnpm links only the ROOT project's deps,
        # leaving every workspace package without node_modules.
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -w typecheck

      - name: Format
        run: pnpm -w format:check

      - name: Ensure local main ref (pull_request checkouts have none)
        run: git show-ref --verify --quiet refs/heads/main || git branch main origin/main

      - name: Review-readiness policy
        run: pnpm -w review:check

      - name: Lint
        run: pnpm -w lint

      - name: Build
        run: pnpm -w build

      - name: Ensure psql client
        # codex round-03 [P1]: `pnpm db:bootstrap` shells out to `psql` — do not assume the
        # runner image has it; install explicitly (a no-op if it's already present) so this
        # never depends on an unverified assumption about the runner's software manifest.
        run: command -v psql >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client)

      - name: Bootstrap definer roles (job_definer, chat_definer, identity_definer)
        # The postgres service container starts BEFORE checkout (see the `services:`
        # block above vs `actions/checkout` at :27), so infra/postgres-init can never
        # run as a docker-entrypoint-initdb.d mount here — this step is the only path
        # that provisions the three definer roles (01/02/03-*.sql) before the DB suite
        # runs (task contract §4.1).
        env:
          DATABASE_URL_MIGRATION: postgres://plexco:plexco_test@localhost:5432/plexco_test
        run: pnpm db:bootstrap

      - name: Test
        run: pnpm -w test

  # Browser E2E for the web app (M1a): signed-out landing, PWA assets + offline fallback, axe
  # WCAG 2.2 AA in light/dark at 375 and 1280. No database: the signed-out paths never open the
  # pool (apps/web/playwright.config.ts). Separate from `verify` so a browser flake cannot mask
  # the DB suite and vice versa.
  e2e-web:
    # pinned: ubuntu-latest moves to 26.04 from 2026-10-19 (actions/runner-images#14748)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 (SHA verified vs tag 2026-07-17; Node 24 runtime)

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9 (peeled SHA verified vs tag 2026-07-17; Node 24 runtime)

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (SHA verified vs tag 2026-07-17; Node 24 runtime)
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build web (stamps the service worker version, then next build)
        # next/font/google downloads Sora + Inter here (network required), so this is the one
        # step that must run on a runner with internet access.
        env:
          DATABASE_URL: postgres://app:unused@127.0.0.1:1/none
        run: pnpm --filter @plexco/web build

      - name: Install Chromium
        run: pnpm --filter @plexco/web exec playwright install --with-deps chromium

      - name: E2E
        env:
          CI: "true"
          E2E_SKIP_BUILD: "1"
        run: pnpm --filter @plexco/web exec playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0 (commit SHA verified vs tag via GitHub API 2026-10-13)
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7
