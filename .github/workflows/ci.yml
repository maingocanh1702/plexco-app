name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: plexco
          POSTGRES_PASSWORD: plexco_test
          POSTGRES_DB: plexco_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plexco -d plexco_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://plexco:plexco_test@localhost:5432/plexco_test
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 (SHA verified vs tag 2026-07-17; Node 24 runtime)
        with:
          # Full history REQUIRED: the "Review-readiness policy" step below runs
          # `git merge-base --is-ancestor <AUTHORITY_SHA> main` for every pinned
          # verdict. The default shallow checkout (depth 1) has neither those
          # commits nor main's history, so every pin fails AUTHORITY_NOT_MAIN.
          fetch-depth: 0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9 (peeled SHA verified vs tag 2026-07-17; Node 24 runtime)
        # version is taken from the "packageManager" field in package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (SHA verified vs tag 2026-07-17; Node 24 runtime)
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        # NOT `pnpm -w install`: with -w pnpm links only the ROOT project's deps,
        # leaving every workspace package without node_modules.
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -w typecheck

      - name: Format
        run: pnpm -w format:check

      - name: Review-readiness policy
        run: pnpm -w review:check

      - name: Lint
        run: pnpm -w lint

      - name: Build
        run: pnpm -w build

      - name: Ensure psql client
        # codex round-03 [P1]: `pnpm db:bootstrap` shells out to `psql` — do not assume the
        # runner image has it; install explicitly (a no-op if it's already present) so this
        # never depends on an unverified assumption about the runner's software manifest.
        run: command -v psql >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client)

      - name: Bootstrap job_definer role
        # The postgres service container starts BEFORE checkout (see the `services:`
        # block above vs `actions/checkout` at :27), so infra/postgres-init can never
        # run as a docker-entrypoint-initdb.d mount here — this step is the only path
        # that provisions job_definer before the DB suite runs (task contract §4.1).
        env:
          DATABASE_URL_MIGRATION: postgres://plexco:plexco_test@localhost:5432/plexco_test
        run: pnpm db:bootstrap

      - name: Test
        run: pnpm -w test
