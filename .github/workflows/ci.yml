name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: plexco
          POSTGRES_PASSWORD: plexco_test
          POSTGRES_DB: plexco_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plexco -d plexco_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://plexco:plexco_test@localhost:5432/plexco_test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version is taken from the "packageManager" field in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        # NOT `pnpm -w install`: with -w pnpm links only the ROOT project's deps,
        # leaving every workspace package without node_modules.
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -w typecheck

      - name: Lint
        run: pnpm -w lint

      - name: Test
        run: pnpm -w test
