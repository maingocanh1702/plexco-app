name: linear-sync

# Tự đồng bộ trạng thái Linear → progress.json (Linear làm leader), gần realtime.
# Trigger:
#   • push            → mỗi lần bạn đẩy code (branch/PR đã flip Linear qua native integration)
#   • repository_dispatch (linear-changed) → Linear webhook bắn sự kiện = realtime đúng nghĩa
#   • workflow_dispatch → sync hoặc reconcile structure có kiểm soát
#   • schedule */10    → lưới an toàn nếu webhook lỡ
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [linear-changed]
  workflow_dispatch:
    inputs:
      mode:
        description: "Linear operation"
        required: true
        default: sync
        type: choice
        options:
          - sync
          - reconcile-check
          - reconcile-apply
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: linear-sync
  # Reconcile can push a projection commit, which triggers another run. Queue it
  # instead of canceling the mutation/post-verification job that caused the push.
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 (SHA verified vs tag 2026-07-17; Node 24 runtime)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (SHA verified vs tag 2026-07-17; Node 24 runtime)
        with:
          node-version: "22"

      - name: Check canonical structure → Linear
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'reconcile-check'
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          if [ -z "$LINEAR_API_KEY" ]; then
            echo "✗ LINEAR_API_KEY chưa cấu hình."
            exit 1
          fi
          node linear-reconcile.mjs --check

      - name: Reconcile canonical structure → Linear
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'reconcile-apply'
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          if [ -z "$LINEAR_API_KEY" ]; then
            echo "✗ LINEAR_API_KEY chưa cấu hình."
            exit 1
          fi
          node linear-reconcile.mjs --apply

      - name: Pull Linear → progress.json
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'sync' || inputs.mode == 'reconcile-apply'
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          if [ -z "$LINEAR_API_KEY" ]; then
            echo "⏭  LINEAR_API_KEY chưa cấu hình — bỏ qua sync (không fail CI)."
            exit 0
          fi
          node linear-sync.mjs

      - name: Commit nếu có thay đổi
        run: |
          if [ -n "$(git status --porcelain progress.json linear-snapshot.json plexco-dashboard.html)" ]; then
            git config user.name  "linear-sync[bot]"
            git config user.email "actions@github.com"
            git add progress.json linear-snapshot.json plexco-dashboard.html
            git commit -m "chore: sync progress from Linear [skip ci]"
            git push
          else
            echo "Không có thay đổi."
          fi
