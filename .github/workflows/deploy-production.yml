name: Deploy production

# PROMOTION ONLY, NO BUILD: deploys the EXACT image digest that already passed deploy-staging.yml,
# with the spec and scripts of the commit that run built. Nothing triggers it automatically -
# workflow_dispatch with a typed confirmation, and `environment: production` carries required
# reviewers (owner). A dispatch with `rollback_deployment_id` runs the `rollback` job instead.
# docs/standards/environments-setup.md §6 is the contract.
#
# DO NOT RUN until the owner has closed the open gates in docs/standards/environments-setup.md
# §1.1 (fixed outbound-IP evidence) and §10, and has recorded a "go" in the go/no-go note.
# Production deploy is a P0, owner-only action: the owner sets up the `production` environment and
# its protection, enters every secret and variable value and presses workflow_dispatch.
#
# MIGRATION PATH (the one canonical choice, as in deploy-staging.yml): the App Spec's PRE_DEPLOY
# `migrate` job, not a CI-runner step. The managed DB only trusts the app's private VPC identity
# (§2), so DATABASE_URL_MIGRATION lives as a secret on that one DO job component only - never in
# GitHub, never on a runtime component.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Deploy: the full 40-char git SHA that deploy-staging.yml built and tested (= the image tag)."
        required: false
        type: string
      digest:
        description: "Deploy: the image_digest in that run's deployment-evidence.json (sha256:...)."
        required: false
        type: string
      staging_run_id:
        description: "Deploy: the run id of the SUCCESSFUL deploy-staging.yml run of that SHA."
        required: false
        type: string
      confirm:
        description: "Typed confirmation: the tag again for a deploy, or rollback_deployment_id again for a rollback."
        required: false
        type: string
      rollback_deployment_id:
        description: "Rollback only: the id of a recent successful deployment. Empty: promote the tag above."
        required: false
        type: string

permissions: {}

# bash with -o pipefail: a failing `yq`/`doctl` at the head of a pipe must fail the step.
defaults:
  run:
    shell: bash

# Two runs (deploy or rollback) must never race on the same app; queue instead of cancelling one in
# flight.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: plexco

jobs:
  production:
    if: inputs.rollback_deployment_id == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      actions: read
    env:
      TAG: ${{ inputs.tag }}
      DIGEST: ${{ inputs.digest }}
      STAGING_RUN_ID: ${{ inputs.staging_run_id }}
    steps:
      - name: Refuse unless the inputs are a full SHA, a digest and a run id, and confirm is the tag typed again
        id: validate
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          [[ "$TAG" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::tag is not a full 40-char git SHA"; exit 1; }
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::digest is not a sha256 image digest"; exit 1; }
          [[ "$STAGING_RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::staging_run_id is not a run id"; exit 1; }
          [ "$CONFIRM" = "$TAG" ] || { echo "::error::confirm must equal tag exactly"; exit 1; }

      # After validation: the spec and scripts come from the built commit, and none of them runs
      # before the staging-run check below passes.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 (SHA verified vs tag 2026-07-17; Node 24 runtime)
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Require the successful deploy-staging run of this tag and its evidence of this digest
        # gh and jq only. A missing field reads null and fails. A rollback run of deploy-staging.yml
        # uploads rollback-evidence-staging only, so it can never pass.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          staging_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${STAGING_RUN_ID}")"
          jq '{path, conclusion, head_sha}' <<< "$staging_run"
          jq -e --arg tag "$TAG" '.path == ".github/workflows/deploy-staging.yml" and .conclusion == "success" and .head_sha == $tag' <<< "$staging_run" > /dev/null \
            || { echo "::error::run ${STAGING_RUN_ID} is not a successful deploy-staging.yml run of ${TAG}"; exit 1; }
          evidence_dir="$(mktemp -d)"
          gh run download "$STAGING_RUN_ID" -R "$GITHUB_REPOSITORY" -n deployment-evidence-staging -D "$evidence_dir" \
            || { echo "::error::run ${STAGING_RUN_ID} has no deployment-evidence-staging artifact"; exit 1; }
          jq -e --arg digest "$DIGEST" --arg tag "$TAG" '.image_digest == $digest and .git_sha == $tag' "${evidence_dir}/deployment-evidence.json" > /dev/null \
            || { echo "::error::the staging evidence does not record ${DIGEST} built from ${TAG}"; exit 1; }

      - uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: 1. Require the staged image in DOCR (this digest, tagged with this SHA; nothing is built)
        run: |
          doctl registry repository list-manifests "$IMAGE_REPOSITORY" -o json \
            | jq -e --arg digest "$DIGEST" --arg tag "$TAG" 'any(.[]?; .digest == $digest and any(.tags[]?; . == $tag))' > /dev/null \
            || { echo "::error::DOCR ${IMAGE_REPOSITORY} has no manifest ${DIGEST} tagged ${TAG}"; exit 1; }

      - name: 2. Render the spec (committed spec + live secrets + this digest)
        env:
          IMAGE_DIGEST: ${{ inputs.digest }}
          VPC_ID: ${{ vars.DO_VPC_ID }}
          APP_ID: ${{ vars.DO_APP_ID }}
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
        run: |
          # The production host is exactly the apex plexco.app; any other domain, a staging one
          # included, stops here.
          [[ "$APP_DOMAIN" =~ ^plexco\.app$ ]] || { echo "::error::APP_DOMAIN is not plexco.app"; exit 1; }
          doctl apps spec get "$APP_ID" --format json > live-spec.json
          yq -o=json infra/app.prod.yaml | infra/render-app-spec.sh live-spec.json > rendered-spec.json
          # Never print the rendered spec: it holds encrypted EV[...] secret values.
          jq '{name, region, components: [(.services, .workers, .jobs)[] | {name, digest: .image.digest}]}' rendered-spec.json

      - name: 3. Reconcile the app (creates the deployment; the PRE_DEPLOY migrate job runs first)
        env:
          APP_ID: ${{ vars.DO_APP_ID }}
        run: doctl apps update "$APP_ID" --spec rendered-spec.json

      - name: 4. Wait for the deployment carrying this digest to be ACTIVE
        env:
          APP_ID: ${{ vars.DO_APP_ID }}
        run: infra/wait-for-deployment.sh "$APP_ID" "$DIGEST" 1500

      - name: 5. Smoke (/healthz, landing, manifest)
        # Runner node only: scripts/smoke-predeploy.mjs imports nothing. A smoke of another origin
        # would read green, so the base URL's host must be APP_DOMAIN.
        env:
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
        run: |
          host="${PRODUCTION_BASE_URL#https://}"; [ "${host%%/*}" = "$APP_DOMAIN" ] || { echo "::error::the PRODUCTION_BASE_URL host is not APP_DOMAIN"; exit 1; }
          infra/smoke-check.sh "$PRODUCTION_BASE_URL"

      - name: Record deployment evidence
        # Step 3 mutates before steps 4 and 5 can fail, so a failed promotion leaves a record too, but
        # only after the first step accepted the inputs: a refused input is never printed or recorded.
        # outcome is the job status when this step starts: success only if every earlier step passed.
        if: always() && steps.validate.outcome == 'success'
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          jq -n --arg env production --arg sha "$TAG" --arg digest "$DIGEST" --arg staging "$STAGING_RUN_ID" --arg outcome "$JOB_STATUS" \
            --arg run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg actor "$GITHUB_ACTOR" --arg at "$(date -u +%FT%TZ)" \
            '{environment:$env, outcome:$outcome, git_sha:$sha, image_digest:$digest, promoted_from_staging_run:$staging, deployed_at:$at, run_url:$run, triggered_by:$actor}' \
            > deployment-evidence.json
          cat deployment-evidence.json

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0 (commit SHA verified vs tag via GitHub API 2026-10-13)
        if: always() && steps.validate.outcome == 'success'
        with:
          name: deployment-evidence-production
          path: deployment-evidence.json
          retention-days: 365

  # Rollback: restores one of the app's ten most recent successful deployments through the documented
  # API (doctl has no rollback subcommand). App-only: the schema stays at the newer version (there is
  # no down-migration), so it is safe only across expand-only migrations; database data comes back
  # only from a Managed Databases backup. Fallback: the Control Panel rollback (Activity tab).
  rollback:
    if: inputs.rollback_deployment_id != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
    env:
      DEPLOYMENT_ID: ${{ inputs.rollback_deployment_id }}
      APP_ID: ${{ vars.DO_APP_ID }}
    steps:
      - name: R1. Refuse unless the target is an explicit deployment id, typed twice, and APP_DOMAIN is this environment's host
        id: validate
        env:
          CONFIRM: ${{ inputs.confirm }}
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
        run: |
          [[ "$DEPLOYMENT_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] || { echo "::error::rollback_deployment_id is not a deployment id"; exit 1; }
          [ "$CONFIRM" = "$DEPLOYMENT_ID" ] || { echo "::error::confirm must equal rollback_deployment_id exactly"; exit 1; }
          # The deploy job's render-step regex: R7 smokes APP_DOMAIN, so it must be the production host.
          [[ "$APP_DOMAIN" =~ ^plexco\.app$ ]] || { echo "::error::APP_DOMAIN is not plexco.app"; exit 1; }

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 (SHA verified vs tag 2026-07-17; Node 24 runtime)
        with:
          persist-credentials: false

      - uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: R4. Check the target (this environment's app, exactly one deployment, not the active one, a web image digest other than the active one's)
        # jq reads through pipes or a here-string: the app and deployment JSON carry their spec and
        # are never printed. As the deploy job's render step does, refuse a live app whose spec name
        # is not the committed one: a DO_APP_ID naming the other environment's app stops here.
        # R6 waits by digest, so a target that carries the active deployment's web image digest (after
        # a config-only deployment) cannot be told apart from it: it stops here too, and an empty
        # active digest fails closed. Fallback: the Control Panel rollback.
        run: |
          app="$(doctl apps get "$APP_ID" -o json)"
          want="$(yq -o=json infra/app.prod.yaml | jq -r '.name // empty')"
          have="$(jq -r '.[0].spec.name // empty' <<< "$app")"
          if [ -z "$want" ] || [ "$have" != "$want" ]; then echo "::error::DO_APP_ID is not the app named in infra/app.prod.yaml"; exit 1; fi
          active="$(jq -r '.[0].active_deployment.id // empty' <<< "$app")"
          [ -n "$active" ] || { echo "::error::app field .[0].active_deployment.id missing"; exit 1; }
          digest="$(doctl apps get-deployment "$APP_ID" "$DEPLOYMENT_ID" -o json | jq -r --arg active "$active" \
            'if length == 1 and .[0].id != $active then first(.[0].spec.services[]? | select(.name == "web") | .image.digest) // empty else empty end')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::the target is not one inactive deployment with a web image digest"; exit 1; }
          active_digest="$(jq -r 'first(.[0].active_deployment.spec.services[]? | select(.name == "web") | .image.digest) // empty' <<< "$app")"
          [[ "$active_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::app field .[0].active_deployment web image digest missing"; exit 1; }
          [ "$digest" != "$active_digest" ] || { echo "::error::the target carries the active deployment's web image digest, which the wait cannot tell apart; use the Control Panel rollback"; exit 1; }
          echo "TARGET_DIGEST=${digest}" >> "$GITHUB_ENV"

      - name: R5. Roll back through the documented API (skip_pin, so later deploys are not blocked)
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          jq -n --arg id "$DEPLOYMENT_ID" '{deployment_id: $id, skip_pin: true}' \
            | curl -fsS -o /dev/null -X POST "https://api.digitalocean.com/v2/apps/${APP_ID}/rollback" \
              -H "Authorization: Bearer ${DIGITALOCEAN_ACCESS_TOKEN}" -H "Content-Type: application/json" --data-binary @-

      - name: R6. Wait for the rollback deployment to be ACTIVE
        run: infra/wait-for-deployment.sh "$APP_ID" "$TARGET_DIGEST" 1500

      - name: R7. Smoke (/healthz, landing, manifest)
        env:
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
        run: |
          host="${PRODUCTION_BASE_URL#https://}"; [ "${host%%/*}" = "$APP_DOMAIN" ] || { echo "::error::the PRODUCTION_BASE_URL host is not APP_DOMAIN"; exit 1; }
          infra/smoke-check.sh "$PRODUCTION_BASE_URL"

      - name: R8. Record rollback evidence
        # Only after R1 accepted the inputs: a refused input is never printed or recorded. outcome is
        # the job status when R8 starts: success only if every earlier step passed.
        if: always() && steps.validate.outcome == 'success'
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          jq -n --arg env production --arg id "$DEPLOYMENT_ID" --arg digest "${TARGET_DIGEST:-}" --arg outcome "$JOB_STATUS" \
            --arg run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg actor "$GITHUB_ACTOR" --arg at "$(date -u +%FT%TZ)" \
            '{environment:$env, action:"rollback", outcome:$outcome, target_deployment_id:$id, image_digest:$digest, run_url:$run, triggered_by:$actor, at:$at}' \
            > rollback-evidence.json
          cat rollback-evidence.json

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0 (commit SHA verified vs tag via GitHub API 2026-10-13)
        if: always() && steps.validate.outcome == 'success'
        with:
          name: rollback-evidence-production
          path: rollback-evidence.json
          retention-days: 365
