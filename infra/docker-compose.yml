# Plexco — dev compose: Postgres + web + worker (+ discovery optional).
# Port theo Port Registry (README): web 3000 · postgres 5432 · drizzle studio 4983.
# ⚠️ P0 TEMPLATE — chạy được sau khi scaffold apps/*. Dùng cho DEV, không phải prod.
# Up:   docker compose -f infra/docker-compose.yml up -d
# Chỉ Postgres (như README §Khởi tạo): docker compose -f infra/docker-compose.yml up -d postgres

name: plexco

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: plexco
      POSTGRES_PASSWORD: plexco_dev
      POSTGRES_DB: plexco
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Convenience only for a genuinely FRESH volume (docker-entrypoint-initdb.d runs once,
      # skipped entirely once pgdata is populated) — never the contract. `pnpm db:bootstrap`
      # (package.json) applying the same idempotent file to a RUNNING cluster is the path
      # every environment (CI, existing local, production) actually depends on.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plexco -d plexco"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ..              # repo root (cần packages/ + apps/)
      dockerfile: infra/Dockerfile
    environment:
      PROCESS_ROLE: web
      NODE_ENV: development
      PORT: "3000"
      # dev: pooled & direct trỏ cùng 1 Postgres (chưa cần PgBouncer)
      DATABASE_URL: postgres://plexco:plexco_dev@postgres:5432/plexco
      DATABASE_URL_DIRECT: postgres://plexco:plexco_dev@postgres:5432/plexco
    env_file:
      # secret dev (TELEGRAM_BOT_TOKEN, SEPAY_WEBHOOK_SECRET, ...) — optional để
      # `docker compose up` chạy được trước khi copy .env.example → .env
      - path: ../.env
        required: false
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  # ⚠️ Worker trên DB SẠCH cần bước chuẩn-bị-DB trước (theo THỨ TỰ):
  #   0) job_definer bootstrap (idempotent, cluster-global — chỉ cần chạy 1 lần/cluster;
  #      trên volume MỚI TINH, mount ./postgres-init ở service postgres đã lo việc này;
  #      trên volume ĐÃ CÓ DỮ LIỆU, chạy thủ công trước bước 1). `pnpm db:bootstrap` cần
  #      `psql` trên HOST (không có sẵn trên máy chỉ cài Docker, codex round-03 [P1]):
  #      DATABASE_URL_MIGRATION=postgres://plexco:plexco_dev@localhost:5432/plexco pnpm db:bootstrap
  #      Không có `psql` host? Dùng psql của CHÍNH container postgres, feed file qua stdin:
  #      docker compose -f infra/docker-compose.yml exec -T postgres \
  #        psql -U plexco -d plexco -v ON_ERROR_STOP=1 -f - < infra/postgres-init/01-job-definer.sql
  #   1) migrations current baseline 0000→0033 (roles + schema + RLS — runner ở slice db-RLS),
  #   2) pgboss provisioning (truyền URL migration AD-HOC, không qua .env —
  #      .env bị nạp vào runtime services):
  #      docker compose -f infra/docker-compose.yml run --rm \
  #        -e DATABASE_URL_MIGRATION=postgres://plexco:plexco_dev@postgres:5432/plexco \
  #        worker provision
  # Chưa chạy 2 bước đó → worker fail-fast có chủ đích (migrate:false, không DDL
  # bằng role runtime). Wiring tự động vào compose/production thuộc slice db-RLS +
  # infra-do-app-vpc-deployment.
  #
  # ⚠️ job-runtime-dispatcher (AP-33): worker.ts giờ chạy preflight fail-closed
  #   trước boss.start(), ĐÒI session_user VÀ current_user đều = app_worker
  #   (không chấp nhận role switch từ credential khác). KHÔNG kiểm role
  #   attributes/CREATE trên pgboss/job_definer membership — least-privilege
  #   attestation đó ngoài scope preflight này (founder decision 2026-07-27,
  #   chi tiết ở đầu apps/bot/src/preflight.ts). Role app_worker (tạo ở
  #   migration 0000) có LOGIN nhưng chưa có password —
  #   set MỘT LẦN/cluster (sau bước 1 migrations, trước khi start worker):
  #     docker compose -f infra/docker-compose.yml exec -T postgres \
  #       psql -U plexco -d plexco -c "ALTER ROLE app_worker WITH PASSWORD 'plexco_dev_worker'"
  #   Giá trị 'plexco_dev_worker' khớp DATABASE_URL_DIRECT dưới đây và .env.example —
  #   KHÔNG dùng password cố định này ở ngoài local dev.
  #   ⚠️ Chạy test sau đó (`pnpm -w test`, hay apps/bot/packages/db riêng lẻ)?
  #      password app_worker (cluster-global) bị đổi bởi MỌI suite chạm DB —
  #      không suite nào khôi phục lại. Chạy lại lệnh ALTER ROLE ở trên trước
  #      khi start worker lần nữa. Chi tiết: .env.example.
  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    environment:
      PROCESS_ROLE: worker
      NODE_ENV: development
      # worker cần DIRECT connection (pg-boss LISTEN/NOTIFY + advisory lock) VÀ
      # phải là role app_worker đúng nghĩa (preflight fail-closed đòi hỏi, xem
      # comment phía trên) — không dùng credential migration/superuser ở đây.
      DATABASE_URL_DIRECT: postgres://app_worker:plexco_dev_worker@postgres:5432/plexco
    env_file:
      - path: ../.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy

  # Optional: chạy riêng discovery để test đường đọc public (profile "full")
  discovery:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: infra/Dockerfile
    environment:
      PROCESS_ROLE: discovery
      NODE_ENV: development
      PORT: "3000"
      DATABASE_URL: postgres://plexco:plexco_dev@postgres:5432/plexco
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
