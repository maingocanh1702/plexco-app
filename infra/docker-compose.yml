# Plexco — dev compose: Postgres + web + worker (+ discovery optional).
# Port theo Port Registry (README): web 3000 · postgres 5432 · drizzle studio 4983.
# ⚠️ P0 TEMPLATE — chạy được sau khi scaffold apps/*. Dùng cho DEV, không phải prod.
# Up:   docker compose -f infra/docker-compose.yml up -d
# Chỉ Postgres (như README §Khởi tạo): docker compose -f infra/docker-compose.yml up -d postgres

name: plexco

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: plexco
      POSTGRES_PASSWORD: plexco_dev
      POSTGRES_DB: plexco
    ports:
      # Loopback only (audit 2026-09-06 X-2): "5432:5432" publishes the dev SUPERUSER on
      # every interface of the host — a laptop on café wifi was a listening plexco/plexco_dev.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Convenience only for a genuinely FRESH volume (docker-entrypoint-initdb.d runs once,
      # skipped entirely once pgdata is populated) — never the contract. `pnpm db:bootstrap`
      # (package.json) applying the same idempotent file to a RUNNING cluster is the path
      # every environment (CI, existing local, production) actually depends on.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plexco -d plexco"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ..              # repo root (cần packages/ + apps/)
      dockerfile: infra/Dockerfile
    environment:
      PROCESS_ROLE: web
      NODE_ENV: development
      PORT: "3000"
      # Role `app` (NOBYPASSRLS), KHÔNG phải superuser — audit 2026-09-06 X-4: web dev
      # từng chạy bằng plexco (superuser) nên RLS vô hình ở dev, mọi lỗi policy chỉ lộ
      # ở test/prod. Password dev set MỘT LẦN/cluster (xem khối "Role passwords" dưới).
      # dev: pooled trỏ thẳng Postgres (chưa cần PgBouncer); web KHÔNG đọc
      # DATABASE_URL_DIRECT (grep process.env apps/web 2026-09-06) nên không khai ở đây.
      DATABASE_URL: postgres://app:plexco_dev_app@postgres:5432/plexco
      # Audit 2026-09-06 W-10: web asserts its DB role on first use and fails closed on mismatch
      # (apps/web/lib/session-cookies.ts appDb). Unset = no check (tests, ad-hoc tooling).
      DB_EXPECTED_ROLE: app
      # Readonly DSN for the public discovery read (apps/web/lib/discovery-route-support.ts).
      DISCOVERY_DATABASE_URL: postgres://readonly:plexco_dev_readonly@postgres:5432/plexco
      # Discovery ingress serves only /healthz, /discover* and /api/discover* (apps/web/middleware.ts); web serves all.
    env_file:
      # secret dev (SEPAY_WEBHOOK_SECRET, GOOGLE_OAUTH_*, ...) — optional để
      # `docker compose up` chạy được trước khi copy .env.example → .env.
      # `environment:` ở trên THẮNG .env (compose precedence) — DATABASE_URL trong
      # .env trỏ localhost cho tooling trên host, không phải cho container này.
      - path: ../.env
        required: false
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  # ⚠️ Worker trên DB SẠCH cần bước chuẩn-bị-DB trước (theo THỨ TỰ):
  #   0) definer bootstrap: job_definer · chat_definer · identity_definer (01/02/03 trong
  #      ./postgres-init; idempotent, cluster-global — chỉ cần chạy 1 lần/cluster;
  #      trên volume MỚI TINH, mount ./postgres-init ở service postgres đã lo việc này;
  #      trên volume ĐÃ CÓ DỮ LIỆU — kể cả volume tạo trước khi có 03-identity-definer.sql
  #      (migration 0054 đòi role này) — chạy thủ công trước bước 1). `pnpm db:bootstrap` cần
  #      `psql` trên HOST (không có sẵn trên máy chỉ cài Docker, codex round-03 [P1]):
  #      DATABASE_URL_MIGRATION=postgres://plexco:plexco_dev@localhost:5432/plexco pnpm db:bootstrap
  #      Không có `psql` host? Dùng psql của CHÍNH container postgres, feed TỪNG file qua stdin
  #      (đủ cả 3, đúng thứ tự):
  #      for f in 01-job-definer 02-chat-definer 03-identity-definer; do
  #        docker compose -f infra/docker-compose.yml exec -T postgres \
  #          psql -U plexco -d plexco -v ON_ERROR_STOP=1 -f - < infra/postgres-init/$f.sql; done
  #   1) TẤT CẢ migrations trong packages/db/migrations (roles + schema + RLS + functions —
  #      `pnpm --filter @plexco/db migrate`; không pin số đuôi ở đây, nó mục nhanh),
  #   2) pgboss provisioning (truyền URL migration AD-HOC, không qua .env —
  #      .env bị nạp vào runtime services):
  #      docker compose -f infra/docker-compose.yml run --rm \
  #        -e DATABASE_URL_MIGRATION=postgres://plexco:plexco_dev@postgres:5432/plexco \
  #        worker provision
  # Chưa chạy 2 bước đó → worker fail-fast có chủ đích (migrate:false, không DDL
  # bằng role runtime). Wiring tự động vào compose/production thuộc slice db-RLS +
  # infra-do-app-vpc-deployment.
  #
  # ⚠️ job-runtime-dispatcher (AP-33): worker.ts giờ chạy preflight fail-closed
  #   trước boss.start(), ĐÒI session_user VÀ current_user đều = app_worker
  #   (không chấp nhận role switch từ credential khác). KHÔNG kiểm role
  #   attributes/CREATE trên pgboss/job_definer membership — least-privilege
  #   attestation đó ngoài scope preflight này (founder decision 2026-07-27,
  #   chi tiết ở đầu apps/bot/src/preflight.ts).
  #
  # ⚠️ Role passwords (MỘT LẦN/cluster, sau bước 1 migrations, trước khi start service):
  #   Ba role runtime app / app_worker / readonly (tạo ở migration 0000) có LOGIN nhưng
  #   KHÔNG có password. Set cả ba bằng một lệnh:
  #     docker compose -f infra/docker-compose.yml exec -T postgres \
  #       psql -U plexco -d plexco -v ON_ERROR_STOP=1 \
  #         -c "ALTER ROLE app        WITH PASSWORD 'plexco_dev_app'" \
  #         -c "ALTER ROLE app_worker WITH PASSWORD 'plexco_dev_worker'" \
  #         -c "ALTER ROLE readonly   WITH PASSWORD 'plexco_dev_readonly'"
  #   Ba giá trị khớp DATABASE_URL của web (app), DATABASE_URL_DIRECT của worker
  #   (app_worker), DATABASE_URL của discovery (readonly) dưới đây và .env.example —
  #   KHÔNG dùng các password cố định này ở ngoài local dev.
  #   ⚠️ Chạy test sau đó (`pnpm -w test`, hay apps/bot/packages/db/apps/web riêng lẻ)?
  #      password của CẢ BA role (cluster-global) bị đổi bởi các suite chạm DB
  #      (packages/db/src/test-harness.ts đặt plexco_test_app / plexco_test_readonly,
  #      apps/bot + packages/db đặt app_worker) — không suite nào khôi phục lại. Chạy lại
  #      lệnh ALTER ROLE ở trên trước khi start service lần nữa. Chi tiết: .env.example.
  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    environment:
      PROCESS_ROLE: worker
      NODE_ENV: development
      # worker cần DIRECT connection (pg-boss LISTEN/NOTIFY + advisory lock) VÀ
      # phải là role app_worker đúng nghĩa (preflight fail-closed đòi hỏi, xem
      # comment phía trên) — không dùng credential migration/superuser ở đây.
      DATABASE_URL_DIRECT: postgres://app_worker:plexco_dev_worker@postgres:5432/plexco
      # Đây là TOÀN BỘ biến apps/bot/src đọc lúc runtime (grep process.env 2026-09-06:
      # worker.ts → DATABASE_URL_DIRECT, OUTBOX_DISPATCH_SCHEDULE_ENABLED; heartbeat.ts →
      # WORKER_HEARTBEAT_FILE / WORKER_ID (tuỳ chọn, mặc định /tmp/plexco-worker-heartbeat và
      # hostname); provision-queue.ts → DATABASE_URL_MIGRATION, truyền ad-hoc bằng `run -e`,
      # KHÔNG khai ở đây).
      # Không còn `env_file: ../.env` (audit 2026-09-06 X-4): worker từng nhận cả file
      # secret (SEPAY/GOOGLE/KMS...) dù không đọc biến nào trong đó.
      # Giữ nguyên "false" — enablement blocker AP-35, xem .env.example.
      OUTBOX_DISPATCH_SCHEDULE_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy

  # Optional: chạy riêng discovery để test đường đọc public (profile "full")
  discovery:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: infra/Dockerfile
    environment:
      PROCESS_ROLE: discovery
      NODE_ENV: development
      PORT: "3000"
      # Role readonly theo hợp đồng entrypoint.sh (discovery = SELECT-only trên
      # public_sessions/public views), không phải superuser. Password: khối "Role passwords".
      DATABASE_URL: postgres://readonly:plexco_dev_readonly@postgres:5432/plexco
      DB_EXPECTED_ROLE: readonly
      DISCOVERY_DATABASE_URL: postgres://readonly:plexco_dev_readonly@postgres:5432/plexco
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
