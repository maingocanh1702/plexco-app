# Plexco — BOUNDED FALLBACK config (DD-04): 1 image → 3 process group.
# KHÔNG phải production primary. Chỉ dùng nếu egress-IP gate buộc fallback (a):
# Fly static egress + DO trusted-source allowlist + TLS sslmode=verify-full.
# ⚠️ P0 TEMPLATE — đặt secret bằng `fly secrets set`, KHÔNG commit giá trị thật.
# Deploy:   fly deploy -c infra/fly.toml
# Secrets:  fly secrets set DATABASE_URL=... DATABASE_URL_DIRECT=... ...

app = "plexco"
primary_region = "sin"   # Singapore — độ trễ thấp nhất tới VN

[build]
  dockerfile = "Dockerfile"

# ⚠️ Provisioning DB (current baseline migrations 0000→0013 RỒI pgboss schema/queues, đều bằng
# role migration): KHÔNG dùng `[deploy] release_command` — nó đòi
# DATABASE_URL_MIGRATION làm APP secret, mà Fly inject app secret vào MỌI máy
# runtime (web/discovery/worker) → lộ DDL credential, phá cách ly role
# (feature_multi_tenant_tech §1). Chạy từ CI hoặc one-shot machine với secret
# riêng. Production DO dùng task `infra-do-app-vpc-deployment`; runner migrations
# + thứ tự chuẩn-bị-DB thuộc slice db-postgres-drizzle-rls.

# Env CHUNG (không bí mật). Secret set qua `fly secrets set`.
[env]
  PORT = "3000"
  NODE_ENV = "production"
  TRUSTED_INGRESS_PROVIDER = "fly"

# --- Process groups: entrypoint.sh nhận role làm $1 -------------------------
[processes]
  web       = "web"        # dashboard + API + SSE + webhook (TG/Zalo/SePay)
  discovery = "discovery"  # chỉ GET /discover (projection-only readonly role)
  worker    = "worker"     # pg-boss scheduler/dispatcher/projector/cron (no ingress)

# --- web: HTTP ingress, autoscale, luôn giữ ≥1 ------------------------------
[[services]]
  processes = ["web"]
  internal_port = 3000
  protocol = "tcp"
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1   # webhook/SSE cần luôn sẵn sàng

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [services.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[services.http_checks]]
    path = "/healthz"
    interval = "10s"
    timeout = "2s"
    grace_period = "10s"

# --- discovery: HTTP ingress, scale ngang theo tải đọc ----------------------
[[services]]
  processes = ["discovery"]
  internal_port = 3000
  protocol = "tcp"
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "requests"
    soft_limit = 400     # đường đọc public, chịu tải cao hơn
    hard_limit = 500

  [[services.http_checks]]
    path = "/healthz"
    interval = "10s"
    timeout = "2s"

# worker: KHÔNG có [[services]] → không ingress công khai.
# pg-boss cần process sống lâu → KHÔNG auto-stop.

# --- VM sizing per process group --------------------------------------------
[[vm]]
  processes = ["web", "discovery"]
  size = "shared-cpu-1x"
  memory = "512mb"

[[vm]]
  processes = ["worker"]
  size = "shared-cpu-1x"
  memory = "512mb"
